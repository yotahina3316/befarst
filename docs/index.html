<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>BE:FIRST Info</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0b0f" />

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>BE:FIRST Info</h1>
    <button id="notify-btn" class="notify-btn" hidden>通知を有効にする</button>
  </header>

  <div class="hero">
    <img src="./images/hero.webp" alt="BE:FIRST" loading="eager" />
  </div>

  <div id="subscription-box" class="subscription-box" hidden>
    <p class="subscription-hint">この内容をコピーして送ってください。送信後は「閉じる」で消せます。</p>
    <textarea id="subscription-output" class="subscription-output" readonly></textarea>
    <button id="subscription-close-btn" class="subscription-close-btn" type="button">閉じる</button>
  </div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="schedule">SCHEDULE</button>
    <button class="tab-btn" data-tab="news">NEWS</button>
  </nav>

  <main>
    <section id="tab-schedule" class="tab-panel active">
      <div class="calendar-header">
        <button id="cal-prev" class="cal-nav-btn" type="button" aria-label="前の月">‹</button>
        <div id="cal-month-label" class="cal-month-label"></div>
        <button id="cal-next" class="cal-nav-btn" type="button" aria-label="次の月">›</button>
      </div>

      <div class="calendar-weekdays">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>

      <div id="calendar-grid" class="calendar-grid"></div>

      <div class="calendar-legend">
        <span class="legend-item"><i class="dot dot-LIVE"></i>ライブ</span>
        <span class="legend-item"><i class="dot dot-GOODS"></i>グッズ</span>
        <span class="legend-item"><i class="dot dot-RELEASE"></i>DVD/Blu-ray</span>
        <span class="legend-item"><i class="dot dot-STREAM"></i>配信/生配信</span>
        <span class="legend-item"><i class="dot dot-DIGITAL"></i>配信リリース</span>
        <span class="legend-item"><i class="dot dot-DEADLINE"></i>申込締切</span>
        <span class="legend-item"><i class="dot dot-BIRTHDAY"></i>誕生日</span>
        <span class="legend-item"><i class="dot dot-ANNIVERSARY"></i>記念日</span>
      </div>

      <div class="calendar-day-detail">
        <h2 id="calendar-day-title" class="calendar-day-title"></h2>
        <div id="calendar-day-events" class="item-list"></div>
      </div>
    </section>

    <section id="tab-news" class="tab-panel">
      <div id="news-list" class="item-list">
        <p class="loading">読み込み中...</p>
      </div>
    </section>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
